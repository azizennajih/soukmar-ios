name: SoukMar
options:
  bundleIdPrefix: com.soukmar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  # Chat (Phase 5) — same Socket.IO protocol as soukmar-backend/src/socket.ts,
  # no REST fallback exists for sending messages/offers. Pulls in Starscream
  # transitively (declared in SocketIO's own Package.swift).
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
  # Masked in-app voice calling (Tranche 23) — iOS has no first-party WebRTC
  # framework. stasel/WebRTC ships a prebuilt Google WebRTC XCFramework via
  # SPM: free, no signup/account/API key, BSD-3-licensed build scripts (the
  # underlying WebRTC code keeps its own webrtc.org license). Pinned to an
  # exact version (not `from:`) since this is a binary framework tracking
  # Chromium release numbers as its major version — an automatic major bump
  # could silently pull an ABI-incompatible binary in CI.
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0

targets:
  SoukMar:
    type: application
    platform: iOS
    sources:
      - path: SoukMar
    dependencies:
      - package: SocketIO
      - package: WebRTC
    info:
      path: SoukMar/Info.plist
      properties:
        CFBundleDisplayName: SouqMar24
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocationWhenInUseUsageDescription: "SouqMar24 utilise votre position pour trouver les annonces proches de vous."
        NSCameraUsageDescription: "SouqMar24 a besoin de l'appareil photo pour prendre des photos de votre annonce."
        NSMicrophoneUsageDescription: "SouqMar24 a besoin du microphone pour les appels audio avec les autres utilisateurs."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soukmar.app
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
      gatherCoverageData: false
