name: SoukMar
options:
  bundleIdPrefix: com.soukmar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  # Chat (Phase 5) — same Socket.IO protocol as soukmar-backend/src/socket.ts,
  # no REST fallback exists for sending messages/offers. Pulls in Starscream
  # transitively (declared in SocketIO's own Package.swift).
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1

targets:
  SoukMar:
    type: application
    platform: iOS
    sources:
      - path: SoukMar
    dependencies:
      - package: SocketIO
    info:
      path: SoukMar/Info.plist
      properties:
        CFBundleDisplayName: SoukMar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soukmar.app
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
      gatherCoverageData: false
